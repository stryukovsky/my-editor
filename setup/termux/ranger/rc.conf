set colorscheme wheat
set show_hidden false
set preview_files false
set confirm_on_delete always
set hidden_filter ^\.git$|^\.DS_Store$|^thumbs\.db$
map c copy
map x cut
map p paste
map a console touch%space
map A console mkdir%space
map r console rename%space
map d delete
map O shell termux-open .
map oo shell tmux new-window -c %d
map f scout -ftsea%space
