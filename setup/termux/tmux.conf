# Fedora navigation, adapted to Termux's clipboard and smaller screen.
bind -n C-q previous-window
bind -n C-w kill-window
bind -n C-e next-window
bind -n C-t new-window -c "#{pane_current_path}"
bind -n C-n new-session
bind -n C-a choose-tree
bind -n C-M-a copy-mode
bind -n C-M-t display-popup -w 95% -h 90% -E htop
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
set -s set-clipboard on
set -g mouse on
set -g default-terminal tmux-256color
set -g status-style 'bg=#f7f1e3,fg=#5d5140'
set -g status-left '#[fg=#c49a2e,bold] #S '
set -g status-right '#[fg=#765613] %H:%M '
setw -g window-status-current-style 'fg=#765613,bold'
